<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — CineMax</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <main>
    <div class="container">
      <form class="panel auth-box" id="form">
        <h1 class="page-title">Create account</h1>
        <div class="page-sub">Book faster and keep all your tickets in one place.</div>
        <div class="field"><label>Full name</label><input id="name" required></div>
        <div class="field"><label>Email</label><input type="email" id="email" required></div>
        <div class="field"><label>Phone</label><input id="phone" required placeholder="03xx-xxxxxxx"></div>
        <div class="field"><label>Password</label><input type="password" id="pw" minlength="6" required></div>
        <div class="field"><label>Confirm password</label><input type="password" id="pw2" minlength="6" required></div>
        <button class="btn block" type="submit">Sign up</button>
        <p class="muted small center mt">Already registered? <a href="login.html" style="color:var(--accent-2)">Login</a></p>
      </form>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    renderHeader("login");
    $("#form").onsubmit = e => {
      e.preventDefault();
      if ($("#pw").value !== $("#pw2").value) return toast("Passwords do not match");
      store.set("cms_user", { name: $("#name").value, email: $("#email").value, phone: $("#phone").value });
      location.href = "index.html";
    };
  </script>
</body>
</html>
